<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <!-- Dark Obsidian Background Gradient -->
    <linearGradient id="adBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1c23" />
      <stop offset="50%" stop-color="#0f1014" />
      <stop offset="100%" stop-color="#07080a" />
    </linearGradient>

    <!-- Electric Orange Gradient -->
    <linearGradient id="adOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7d3b" />
      <stop offset="50%" stop-color="#ff5a1f" />
      <stop offset="100%" stop-color="#e03800" />
    </linearGradient>

    <!-- Titanium Silver Gradient -->
    <linearGradient id="adSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e2e4ea" />
      <stop offset="100%" stop-color="#9ea3b2" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="adBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5a1f" stop-opacity="0.85" />
      <stop offset="40%" stop-color="rgba(255, 255, 255, 0.2)" />
      <stop offset="100%" stop-color="#ff5a1f" stop-opacity="0.4" />
    </linearGradient>

    <!-- Radial Core Ember Glow -->
    <radialGradient id="adCoreGlow" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#ff5a1f" stop-opacity="0.32" />
      <stop offset="70%" stop-color="#ff5a1f" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ff5a1f" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Filter Glow -->
    <filter id="adNeonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Obsidian Badge Container -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#adBgGrad)" stroke="url(#adBorderGrad)" stroke-width="2.2" />

  <!-- Core Glow Accent -->
  <circle cx="50" cy="50" r="38" fill="url(#adCoreGlow)" />

  <!-- Cybernetic Technical Corner Accents -->
  <circle cx="16" cy="16" r="1.5" fill="#ff5a1f" opacity="0.75" />
  <circle cx="84" cy="16" r="1.5" fill="#ff5a1f" opacity="0.4" />
  <circle cx="16" cy="84" r="1.5" fill="#ff5a1f" opacity="0.4" />
  <circle cx="84" cy="84" r="1.5" fill="#ff5a1f" opacity="0.75" />

  <!-- Background Cyber Circuit Traces -->
  <path d="M 16 28 L 16 16 L 28 16" stroke="#ff5a1f" stroke-opacity="0.25" stroke-width="1.2" stroke-linecap="round" fill="none" />
  <path d="M 84 72 L 84 84 L 72 84" stroke="#ff5a1f" stroke-opacity="0.25" stroke-width="1.2" stroke-linecap="round" fill="none" />

  <!-- Geometric Monogram Emblem: Fusion of A and D -->
  <g class="ad-monogram-paths">
    <!-- "D" Outer Curve (Enclosing Right Flank) with Glowing Orange -->
    <path d="M 47 22 L 58 22 C 73 22 81 33 81 50 C 81 67 73 78 58 78 L 43 78" 
          stroke="url(#adOrangeGrad)" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#adNeonFilter)" />

    <!-- "A" Ascending Left Beam (Silver Titanium) -->
    <path d="M 23 78 L 47 22" 
          stroke="url(#adSilverGrad)" 
          stroke-width="5.5" 
          stroke-linecap="round" />

    <!-- "A" Central Vertical / Center Spine -->
    <path d="M 47 22 L 47 78" 
          stroke="url(#adSilverGrad)" 
          stroke-width="5" 
          stroke-linecap="round" />

    <!-- "A" Laser Crossbar: Forward Terminal Glyph &gt; -->
    <path d="M 32 55 L 63 55" 
          stroke="url(#adOrangeGrad)" 
          stroke-width="4.5" 
          stroke-linecap="round" />

    <!-- Core Terminal Prompt Accent Point -->
    <circle cx="63" cy="55" r="2.8" fill="#ffffff" filter="url(#adNeonFilter)" />
  </g>
</svg>
